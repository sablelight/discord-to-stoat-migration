name: Node CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only runs when the repo declares a lint script — otherwise skips.
      - name: Lint
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.lint?0:1)"; then
            npm run lint
          else
            echo "no lint script — skipping"
          fi

      # Only runs when tsconfig.json exists.
      - name: Typecheck
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "no tsconfig — skipping"; fi

      # Only runs when the repo declares a test script.
      - name: Test
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.test?0:1)"; then
            npm test
          else
            echo "no test script — syntax check only"
            for f in $(git ls-files '*.js' '*.mjs' '*.cjs'); do node --check "$f"; done
          fi
