# Dependabot — tailored to the ecosystems actually present in this repo.
version: 2
updates:
  # GitHub Actions (all repos have workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci:"

# node
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "node"]
    commit-message:
      prefix: "deps(npm):"

